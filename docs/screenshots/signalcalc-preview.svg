<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">SignalCalc calculator preview</title>
  <desc id="desc">A dark mobile calculator interface showing the expression 12 times 8 and the result 96.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#080d1f"/><stop offset="1" stop-color="#111b3d"/></linearGradient><linearGradient id="screen" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#151d3d"/><stop offset="1" stop-color="#202e5c"/></linearGradient></defs>
  <rect width="900" height="560" rx="28" fill="url(#bg)"/><circle cx="780" cy="70" r="150" fill="#526dff" opacity=".12"/><circle cx="90" cy="510" r="170" fill="#14d9b3" opacity=".08"/>
  <text x="70" y="110" fill="#f5f7ff" font-family="system-ui,sans-serif" font-size="42" font-weight="700">SignalCalc</text><text x="70" y="148" fill="#aab5d8" font-family="system-ui,sans-serif" font-size="19">Small tool. Sharp signal.</text>
  <g transform="translate(540 40)"><rect width="250" height="480" rx="34" fill="#0b1028" stroke="#35457f" stroke-width="3"/><rect x="14" y="14" width="222" height="452" rx="25" fill="#0f1733"/><rect x="34" y="50" width="182" height="112" rx="18" fill="url(#screen)"/><text x="52" y="84" fill="#9eacd2" font-family="system-ui,sans-serif" font-size="14">12 × 8</text><text x="52" y="137" fill="#f7f9ff" font-family="system-ui,sans-serif" font-size="39" font-weight="700">96</text>
    <g fill="#202d55"><rect x="34" y="184" width="42" height="42" rx="12"/><rect x="82" y="184" width="42" height="42" rx="12"/><rect x="130" y="184" width="42" height="42" rx="12"/><rect x="178" y="184" width="38" height="42" rx="12"/><rect x="34" y="234" width="42" height="42" rx="12"/><rect x="82" y="234" width="42" height="42" rx="12"/><rect x="130" y="234" width="42" height="42" rx="12"/><rect x="178" y="234" width="38" height="42" rx="12"/><rect x="34" y="284" width="42" height="42" rx="12"/><rect x="82" y="284" width="42" height="42" rx="12"/><rect x="130" y="284" width="42" height="42" rx="12"/><rect x="178" y="284" width="38" height="42" rx="12"/><rect x="34" y="334" width="42" height="42" rx="12"/><rect x="82" y="334" width="42" height="42" rx="12"/><rect x="130" y="334" width="42" height="42" rx="12"/><rect x="178" y="334" width="38" height="42" rx="12"/><rect x="34" y="384" width="90" height="42" rx="12"/><rect x="130" y="384" width="42" height="42" rx="12"/><rect x="178" y="384" width="38" height="42" rx="12"/></g>
    <g fill="#dfe7ff" font-family="system-ui,sans-serif" font-size="17" font-weight="600" text-anchor="middle"><text x="55" y="211">C</text><text x="103" y="211">±</text><text x="151" y="211">%</text><text x="197" y="211" fill="#78e7d0">÷</text><text x="55" y="261">7</text><text x="103" y="261">8</text><text x="151" y="261">9</text><text x="197" y="261" fill="#78e7d0">×</text><text x="55" y="311">4</text><text x="103" y="311">5</text><text x="151" y="311">6</text><text x="197" y="311" fill="#78e7d0">−</text><text x="55" y="361">1</text><text x="103" y="361">2</text><text x="151" y="361">3</text><text x="197" y="361" fill="#78e7d0">+</text><text x="79" y="411">0</text><text x="151" y="411">.</text><text x="197" y="411" fill="#78e7d0">=</text></g>
  </g>
  <g transform="translate(70 235)" font-family="system-ui,sans-serif" font-size="20" fill="#e9efff"><circle cx="13" cy="13" r="7" fill="#78e7d0"/><text x="35" y="20">Safe arithmetic parser</text><circle cx="13" cy="73" r="7" fill="#78e7d0"/><text x="35" y="80">Memory persists between sessions</text><circle cx="13" cy="133" r="7" fill="#78e7d0"/><text x="35" y="140">Focused, touch-friendly controls</text></g>
  <text x="70" y="500" fill="#7180a9" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14">MVP preview · Expo + React Native</text>
